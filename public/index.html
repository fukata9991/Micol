<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <title>Micol</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Micol">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <button type="button" class="icon-btn" id="menu-btn" title="メニュー" aria-label="メニュー" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
    </button>
    <a href="#/" class="logo"><img class="logo-mark" src="/icons/icon.svg" alt=""><span class="logo-text">Micol</span></a>
    <form id="search-form" class="search" role="search">
      <button type="button" class="icon-btn search-close" id="search-close" title="検索を閉じる" aria-label="検索を閉じる">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg>
      </button>
      <input type="search" name="q" placeholder="タイトルを検索" autocomplete="off" aria-label="検索">
    </form>
    <button type="button" class="icon-btn search-open" id="search-open" title="検索" aria-label="検索">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    </button>
    <div class="account">
      <button type="button" class="avatar" id="account-btn" title="アカウント" aria-label="アカウント" aria-haspopup="menu" aria-expanded="false"></button>
      <div class="account-menu" id="account-menu" role="menu" hidden></div>
    </div>
  </header>
  <nav class="sidebar" id="sidebar" aria-label="メニュー"></nav>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <main id="view"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
