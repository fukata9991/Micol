<!doctype html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#131316">
  <title>Micol</title>
  <!-- 配色（ダーク / ライト）を描画前に決める（ちらつき防止）。設定の「ライトモード」で切り替える -->
  <script>try { if (localStorage.getItem('micol.theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}</script>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Micol">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <!-- 文字（インターネットにつながらないときは端末の文字で表示する） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <button type="button" class="icon-btn" id="menu-btn" title="メニュー" aria-label="メニュー" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <a href="#/" class="logo"><img class="logo-mark" src="/icons/icon.svg" alt=""><span class="logo-text">Micol</span></a>
    <form id="search-form" class="search" role="search">
      <button type="button" class="icon-btn search-close" id="search-close" title="検索を閉じる" aria-label="検索を閉じる">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" name="q" placeholder="タイトルを検索" autocomplete="off" aria-label="検索">
    </form>
    <button type="button" class="icon-btn search-open" id="search-open" title="検索" aria-label="検索">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
    <div class="account">
      <button type="button" class="avatar" id="account-btn" title="アカウント" aria-label="アカウント" aria-haspopup="menu" aria-expanded="false"></button>
      <div class="account-menu" id="account-menu" role="menu" hidden></div>
    </div>
  </header>
  <nav class="sidebar" id="sidebar" aria-label="メニュー"></nav>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <main id="view"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
