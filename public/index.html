<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <title>Micol</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Micol">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <button type="button" class="icon-btn" id="menu-btn" title="メニュー" aria-label="メニュー" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
    </button>
    <a href="#/" class="logo"><img class="logo-mark" src="/icons/icon.svg" alt="">Micol</a>
    <form id="search-form" class="search" role="search">
      <input type="search" name="q" placeholder="タイトルを検索" autocomplete="off" aria-label="検索">
    </form>
    <div class="size-toggle" role="group" aria-label="サムネイルの大きさ">
      <button type="button" data-size="s" title="小さく表示">小</button>
      <button type="button" data-size="m" title="標準で表示">中</button>
      <button type="button" data-size="l" title="大きく表示">大</button>
    </div>
    <div class="account">
      <button type="button" class="avatar" id="account-btn" title="アカウント" aria-label="アカウント" aria-haspopup="menu" aria-expanded="false"></button>
      <div class="account-menu" id="account-menu" role="menu" hidden></div>
    </div>
  </header>
  <nav class="sidebar" id="sidebar" aria-label="メニュー"></nav>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <main id="view"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
